name: ChatCall
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ChatCall:
    type: application
    platform: iOS
    sources:
      - ChatCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ChatCall
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: ChatCall
  ChatCallTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ChatCallTests
    dependencies:
      - target: ChatCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ChatCallTests
  ChatCallUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ChatCallUITests
    dependencies:
      - target: ChatCall
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ChatCallUITests
schemes:
  ChatCall:
    build:
      targets:
        ChatCall: all
    test:
      targets:
        - ChatCallTests
        - ChatCallUITests
      gatherCoverageData: true
